spring:
  application:
    name: customer-support-agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_agent}
    username: ${DATABASE_USER:support_agent}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  sql:
    init:
      mode: never
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  auth:
    username: ${DEMO_USERNAME}
    password: ${DEMO_PASSWORD}
    secondary-username: ${DEMO_SECONDARY_USERNAME}
    secondary-password: ${DEMO_SECONDARY_PASSWORD}
  embeddings:
    provider: ${EMBEDDING_PROVIDER:ollama}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}
  generation:
    provider: ${GENERATION_PROVIDER:ollama}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_GENERATION_MODEL:qwen3:1.7b}
